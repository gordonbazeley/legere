name: Build PBW

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pbw-latest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Cache Pebble SDK
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.pebble-sdk
          key: pebble-sdk-${{ runner.os }}-4.33.1
      - name: Install JavaScript build dependencies
        run: npm ci
      - name: Install pebble-tool
        run: pip install pebble-tool==5.0.40
      - name: Install Pebble SDK
        run: pebble sdk install 4.33.1
      - name: Build
        run: pebble build
      - name: Check settings handoff
        run: node tools/check.js
      - name: Upload .pbw
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: legere-pbw
          path: build/*.pbw
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: legere-pbw
          path: /tmp/pbw-out
      - name: Publish .pbw to pbw-latest branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan pbw-latest
          git rm -rf . > /dev/null
          cp /tmp/pbw-out/*.pbw .
          git add -- *.pbw
          git commit -m "Build .pbw from ${GITHUB_SHA}"
          git push origin HEAD:pbw-latest --force
